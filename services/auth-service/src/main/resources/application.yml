spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://localhost:5433/auth_db
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/blueceylon
          jwk-set-uri: http://localhost:8180/realms/blueceylon/protocol/openid-connect/certs

server:
  port: 8081

keycloak:
  auth-server-url: http://localhost:8180
  realm: blueceylon
  client-id: blueceylon-web
  admin:
    client-id: auth-service-client
    client-secret: EKZZ5PLIuqFQ8WwWYwJVR6GwzSHQzJgG
