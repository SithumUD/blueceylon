<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; color: #333; }
        .container { max-width: 600px; margin: 40px auto; background: #fff; padding: 20px; border-radius: 8px; border-top: 5px solid #28a745; }
        .header { font-size: 24px; color: #28a745; font-weight: bold; margin-bottom: 20px; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">Congratulations! Your Profile is Approved</div>
    <p>Hi,</p>
    <p>Great news! Your business profile for <strong><span th:text="${businessName}">Name</span></strong> has been officially approved by the Blue Ceylon team.</p>
    <p>Your business is now live on the public catalog. You can now start adding rooms and tour packages to your offerings.</p>
    <p>Cheers,<br/>The Blue Ceylon Team</p>
</div>
</body>
</html>
