server:
  port: 8082

spring:
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  application:
    name: catalog-service
  datasource:
    url: jdbc:postgresql://localhost:5433/catalog_db
    username: catalog_user
    password: catalog_pass
  flyway:
    baseline-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/blueceylon
          jwk-set-uri: http://localhost:8180/realms/blueceylon/protocol/openid-connect/certs

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:dg0eycgai}
  api-key: ${CLOUDINARY_API_KEY:434546544944823}
  api-secret: ${CLOUDINARY_API_SECRET:khPfaI9CkHMN8TanseHjcJwe11Q}


