server:
  port: 8080

spring:
  application:
    name: blueceylon-api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**, /api/v1/auth/**, /api/account/**, /api/v1/account/**
        - id: auth-service-v3
          uri: http://localhost:8081
          predicates:
            - Path=/v3/api-docs/auth-service
          filters:
            - RewritePath=/v3/api-docs/auth-service, /v3/api-docs
        - id: catalog-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/catalog/**
        - id: catalog-service-v3
          uri: http://localhost:8082
          predicates:
            - Path=/v3/api-docs/catalog-service
          filters:
            - RewritePath=/v3/api-docs/catalog-service, /v3/api-docs
        - id: booking-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/booking/**, /api/v1/bookings/**, /api/v1/inquiries/**
        - id: booking-service-v3
          uri: http://localhost:8083
          predicates:
            - Path=/v3/api-docs/booking-service
          filters:
            - RewritePath=/v3/api-docs/booking-service, /v3/api-docs
        - id: payment-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/payment/**
        - id: payment-service-v3
          uri: http://localhost:8084
          predicates:
            - Path=/v3/api-docs/payment-service
          filters:
            - RewritePath=/v3/api-docs/payment-service, /v3/api-docs
        - id: notification-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/v1/notification/**

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/blueceylon
          jwk-set-uri: http://localhost:8180/realms/blueceylon/protocol/openid-connect/certs

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: 1. Auth Service
        url: /v3/api-docs/auth-service
      - name: 2. Catalog Service
        url: /v3/api-docs/catalog-service
      - name: 3. Booking Service
        url: /v3/api-docs/booking-service
      - name: 4. Payment Service
        url: /v3/api-docs/payment-service
