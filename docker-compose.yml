services:
  db:
    image: postgres:15-alpine
    container_name: blue_ceylon_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init-multiple-databases.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - blueceylon-network

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: blue_ceylon_keycloak
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak_db
      KC_DB_USERNAME: keycloak_user
      KC_DB_PASSWORD: keycloak_pass
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8180:8080"
    depends_on:
      - db
    networks:
      - blueceylon-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: blue_ceylon_rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - blueceylon-network

  adminer:
    image: adminer
    container_name: blue_ceylon_adminer
    restart: always
    ports:
      - "8090:8080"
    depends_on:
      - db
    networks:
      - blueceylon-network

  # pgAdmin 4 - Full-featured PostgreSQL Web GUI
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: blue_ceylon_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@blueceylon.lk
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: "True"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_SERVER_JSON_FILE: "/pgadmin4/servers.json"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./db/pgadmin-servers.json:/pgadmin4/servers.json:ro
    depends_on:
      - db
    networks:
      - blueceylon-network

volumes:
  postgres_data:
  pgadmin_data:

networks:
  blueceylon-network:
    driver: bridge
