version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: blue_ceylon_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Mount the initialization script so it runs on first boot
      - ./db/init-multiple-databases.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - blueceylon-network

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: blue_ceylon_keycloak
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak_db
      KC_DB_USERNAME: keycloak_user
      KC_DB_PASSWORD: keycloak_pass
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8180:8080"
    depends_on:
      - db
    networks:
      - blueceylon-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: blue_ceylon_rabbitmq
    restart: always
    ports:
      - "5672:5672"   # AMQP protocol port
      - "15672:15672" # Management UI port
    networks:
      - blueceylon-network

  adminer:
    image: adminer
    container_name: blue_ceylon_adminer
    restart: always
    ports:
      - "8090:8080"
    depends_on:
      - db
    networks:
      - blueceylon-network

volumes:
  postgres_data:

networks:
  blueceylon-network:
    driver: bridge


